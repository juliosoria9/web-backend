name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests
        run: npm test
        env:
          NODE_ENV: test
          # Valores de prueba para el entorno de CI
          DB_URI: mongodb://localhost:27017/bildyapp_test
          JWT_SECRET: test_jwt_secret_at_least_32_characters_long
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_SECRET: test_refresh_secret_at_least_32_chars
          JWT_REFRESH_EXPIRES_IN: 7d
